[project]
name = "stockagent"
version = "0.1.0"
description = "Personal multi-agent research system for Indian equities (NSE/BSE)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nselib>=2.5.1",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=9.0",
    "click>=8.1",
    "rich>=13.7",
    "loguru>=0.7",
    "pandas-ta>=0.3.14b",
    "openai>=1.40",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.10.9",
]

[project.scripts]
stockagent = "stockagent.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ipython>=8.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockagent"]
